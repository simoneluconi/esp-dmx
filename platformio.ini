; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The ESP32-C3 Super Mini uses the native USB (CDC) for serial, not an
; external USB-UART chip: without these two flags Serial won't work.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Filesystem used to persist configuration (DMX fixtures, Wi-Fi credentials)
board_build.filesystem = littlefs
board_build.partitions = default.csv

lib_deps =
    someweisguy/esp_dmx @ ^4.1.0
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/ESPAsyncWebServer @ ^3.9.2
    ESP32Async/AsyncTCP @ ^3.4.7
    rstephan/ArtnetWifi @ ^1.6.2

; ----------------------------------------------------------------------------
; Network (OTA) upload — after the first USB flash, you can push new
; firmware over Wi-Fi instead of plugging the board back in:
;   pio run -e esp32-c3-supermini-ota -t upload --upload-port <name-or-ip>
; The AP SSID / mDNS hostname is generated per-device from its MAC address
; (e.g. "esp32-dmx-9f92.local" — see serial log or the web UI header for the
; exact name), so there is no fixed default here: either pass --upload-port
; on the command line as above, or edit upload_port below for your device.
; upload_flags password must match OTA_PASSWORD from include/config.h.
; ----------------------------------------------------------------------------
[env:esp32-c3-supermini-ota]
extends = env:esp32-c3-supermini
upload_protocol = espota
upload_port = esp32-dmx-xxxx.local
upload_flags =
    --auth=dmxota123
